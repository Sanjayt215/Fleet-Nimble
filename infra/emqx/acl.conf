%% FleetNimble MQTT ACL — mount into EMQX
%% Devices publish to their tenant/vehicle topics; backend ingests all telemetry.

{allow, {user, "backend-ingest"}, subscribe, ["fleet/+/+/telemetry/#", "fleet/+/+/status/#"]}.
{allow, {user, "backend-ingest"}, publish, ["fleet/+/+/cmd/#"]}.

%% Device users (deviceUid) — restrict via EMQX HTTP auth in production
{allow, {user, "_"}, publish, ["fleet/${tenant}/${vehicle}/telemetry/#", "fleet/${tenant}/${vehicle}/status/#"]}.
{allow, {user, "_"}, subscribe, ["fleet/${tenant}/${vehicle}/cmd/#"]}.

{deny, all}.
