version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_secret
      POSTGRES_DB: fleet_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fleet -d fleet_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  emqx:
    image: emqx/emqx:5.1
    container_name: fleet-emqx
    environment:
      EMQX_NAME: fleetnimble
      EMQX_HOST: 127.0.0.1
    ports:
      - '1883:1883'
      - '8883:8883'
      - '18083:18083'
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleet-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://fleet:fleet_secret@postgres:5432/fleet_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-long-random-string
      JWT_REFRESH_SECRET: change-me-refresh-in-production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MQTT_ENABLED: 'true'
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: default
      MQTT_PASSWORD: public
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      emqx:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Waiting for PostgreSQL...' &&
      sleep 5 &&
      echo 'Running Prisma migrations...' &&
      npx prisma migrate deploy &&
      echo 'Running Phase-1 seed...' &&
      node prisma/seed.js &&
      echo 'Running Phase-2 seed...' &&
      node prisma/seed-phase2.js &&
      echo 'All seeds completed. Starting server...' &&
      node src/server.js
      "
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||5000; require('http').get('http://127.0.0.1:'+p+'/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fleet-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
      VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    ports:
      - '3000:80'

volumes:
  postgres_data:
  redis_data:
