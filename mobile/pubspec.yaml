name: fleetnimble_mobile
description: FleetNimble OBD-II telematics mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^2.0.3+1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.12
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.19.0
  mqtt_client: ^10.5.1
  uuid: ^4.5.1
  flutter_foreground_task: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
