services:
  - type: web
    name: fleet-backend
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "npm ci && npx prisma generate && npm run db:migrate:deploy"
    startCommand: "npm start"
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        # Pooled endpoint for the APPLICATION runtime only (keep "-pooler" suffix for Neon).
        # Example: postgresql://USER:PASSWORD@ep-xxxxx-123-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
        value: "postgresql://<USER>:<PASSWORD>@<HOST>-pooler.<REGION>.aws.neon.tech/<DBNAME>?sslmode=require"
      - key: DIRECT_DATABASE_URL
        # DIRECT (unpooled) endpoint used ONLY by Prisma Migrate (npm run db:migrate:deploy).
        # CRITICAL: same connection string but host WITHOUT the "-pooler" suffix.
        # Prisma silently falls back to the pooled DATABASE_URL if this is missing/empty,
        # which causes P1002 (pg_advisory_lock unsupported through Neon's PgBouncer).
        value: "postgresql://<USER>:<PASSWORD>@<DIRECT_HOST>:<PORT>/<DBNAME>?sslmode=require"
      - key: REDIS_URL
        value: "redis://<HOST>:6379"
      - key: JWT_SECRET
        value: "replace-with-strong-secret"
      - key: JWT_REFRESH_SECRET
        value: "replace-with-refresh-secret"
      - key: CORS_ORIGIN
        value: "https://app.your-domain.com"
      - key: MQTT_ENABLED
        value: "false"
  - type: static
    name: fleet-frontend
    env: static
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    publishCommand: "npm run build"
    publishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://fleet-nimble.onrender.com/api"
      - key: VITE_SOCKET_URL
        value: "https://fleet-nimble.onrender.com"
