services:
  - type: web
    name: fleet-backend
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: "npm ci && npx prisma generate && npm run db:migrate:deploy && npm run db:seed"
    startCommand: "npm start"
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        # Neon pooled endpoint (contains "-pooler" suffix).
        # Used for both application runtime AND migrations.
        # The migration wrapper (db-migrate-deploy.js) handles P1002 advisory lock errors
        # with exponential backoff and retry logic.
        # Example: postgresql://USER:PASSWORD@ep-xxxxx-123-pooler.us-east-1.aws.neon.tech/neondb?sslmode=require
        value: "postgresql://<USER>:<PASSWORD>@<HOST>-pooler.<REGION>.aws.neon.tech/<DBNAME>?sslmode=require"
      - key: DIRECT_DATABASE_URL
        # OPTIONAL: If a separate direct (non-pooled) endpoint is available, set it here.
        # For this Neon project, only the pooled endpoint is reachable, so this is ignored.
        # The migration wrapper will use DATABASE_URL with P1002 retry logic.
        value: ""
      - key: REDIS_URL
        value: "redis://<HOST>:6379"
      - key: JWT_SECRET
        value: "replace-with-strong-secret"
      - key: JWT_REFRESH_SECRET
        value: "replace-with-refresh-secret"
      - key: CORS_ORIGIN
        value: "https://app.your-domain.com"
      - key: MQTT_ENABLED
        value: "false"
  - type: static
    name: fleet-frontend
    env: static
    plan: free
    region: oregon
    branch: main
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    publishCommand: "npm run build"
    publishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://fleet-nimble.onrender.com/api"
      - key: VITE_SOCKET_URL
        value: "https://fleet-nimble.onrender.com"
